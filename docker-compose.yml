version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: campomark-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: campomark_user
      MONGO_INITDB_ROOT_PASSWORD: CampoMark@2026
      MONGO_INITDB_DATABASE: campomark
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - campomark-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campomark-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      MONGO_URL: mongodb://campomark_user:CampoMark%402026@mongodb:27017/campomark?authSource=admin
      DB_NAME: campomark
      JWT_SECRET: sua_chave_jwt_super_secreta_aqui_mude_isso
      ADMIN_EMAIL: admin@campomark.com
      ADMIN_PASSWORD: CampoMark@2026
      FRONTEND_URL: https://campomark.saitaro.tech
      STRIPE_SECRET_KEY: sk_test_51234567890abcdefghijklmn
      TRIAL_DAYS: 7
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campomark-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campomark-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - campomark-network

volumes:
  mongo_data:
  mongo_config:

networks:
  campomark-network:
    driver: bridge
